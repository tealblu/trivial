# Keep the README's "Supported games" table in sync with the parsers.

name: Update supported games table

on:
  push:
    branches: [main]
    paths:
      - "parsers/**"
      - "update_readme_games.py"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate Supported games table
        run: python update_readme_games.py

      # No commit is created when the table is already up to date.
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: regenerate supported games table"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com